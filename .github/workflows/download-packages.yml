name: Temporary download links for a GitHub Packages artifact

# Manually triggered: paste the link of a public package (or a ghcr.io reference) and
# choose how long the links should live.
#
# The workflow pulls the package with ORAS and republishes its files as assets of a
# TEMPORARY GitHub Release in THIS repository, under a random tag that carries the
# expiry date, e.g. tmp-20261021-9f3a7c1e2b4d. Every file then has a plain https link
# that works in any browser, without a GitHub login and without installing anything:
#   https://github.com/<you>/<repo>/releases/download/tmp-20261021-9f3a7c1e2b4d/<file>
# The links are listed in the job summary and on the release page.
#
# Expiry: the "expire" job deletes every tmp-* release (and its git tag) whose date has
# passed. It runs every night and also every time this workflow is started, so expired
# links disappear on the next use even if GitHub has paused the nightly schedule (it does
# that in repositories with no activity for 60 days). Start the workflow with an empty
# link to clean up on demand.
#
# Accepted links:
#   https://github.com/<owner>/<repo>/pkgs/container/<name>/<id>?tag=<tag>    (a package version page)
#   https://github.com/users/<owner>/packages/container/package/<name>         (package page; give the tag as input)
#   https://github.com/orgs/<org>/packages/container/<name>/<id>?tag=<tag>
#   ghcr.io/<owner>/<name>:<tag>   or   ghcr.io/<owner>/<name>@sha256:<digest>
#
# Limits:
#   - Release assets must be smaller than 2 GiB. Bigger files are split into
#     <file>.part00, <file>.part01, ...; reassemble with:  cat <file>.part* > <file>
#   - Only packages that contain named files can be downloaded this way (anything pushed
#     with ORAS, such as the release mirrors). Docker images have no file names.
#   - While it exists, the temporary release is listed on the repository's Releases page
#     like any other release; the random tag makes the link unguessable, not secret.
#   - Temporary releases are created with "latest = false", so they never replace the
#     repository's own "Latest release".

on:
  workflow_dispatch:
    inputs:
      package_link:
        description: "Package link or ghcr.io reference, e.g. https://github.com/phan2410/manage/pkgs/container/releases%2Fkieler%2Fsemantics/1382588863?tag=release-1.5 (leave empty to only delete expired links)"
        required: false
        type: string
        default: ""
      tag:
        description: "Tag (or sha256:<digest>) - only needed when the link does not contain one"
        required: false
        type: string
        default: ""
      expires_in_days:
        description: "Delete the links after this many days"
        type: choice
        options: ["1", "3", "7", "14", "30"]
        default: "7"
  schedule:
    - cron: "23 3 * * *"   # nightly cleanup of expired links (03:23 UTC)

permissions:
  contents: write   # create and delete the temporary releases and their git tags
  packages: read    # pull the package (also lets it read your own private packages)

concurrency:
  group: download-package-${{ inputs.package_link }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  expire:
    name: Delete expired links
    runs-on: ubuntu-latest
    steps:
      - name: Delete tmp-* releases whose expiry date has passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y%m%d)"
          deleted=0
          while IFS=$'\t' read -r tag title; do
            [[ "$tag" =~ ^tmp-([0-9]{8})-[0-9a-f]+$ ]] || continue
            expiry="${BASH_REMATCH[1]}"
            if (( 10#$expiry <= 10#$today )); then
              echo "Deleting $tag ($title) - expired on $expiry"
              gh release delete "$tag" --yes
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true   # a draft has no tag
              deleted=$((deleted + 1))
            fi
          done < <(gh release list --limit 1000 --json tagName,name --jq '.[] | [.tagName, .name] | @tsv')
          echo "Deleted $deleted expired temporary release(s)."
          echo "Deleted $deleted expired temporary release(s)." >> "$GITHUB_STEP_SUMMARY"

  download:
    name: Download and publish temporary links
    if: github.event_name == 'workflow_dispatch' && inputs.package_link != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@v2

      - name: Log in to GitHub Packages (ghcr.io)
        env:
          GHCR_USER: ${{ github.actor }}
        run: echo "$GH_TOKEN" | oras login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Resolve the package reference
        id: ref
        env:
          INPUT_LINK: ${{ inputs.package_link }}
          INPUT_TAG: ${{ inputs.tag }}
          EXPIRES_IN_DAYS: ${{ inputs.expires_in_days }}
        run: |
          set -euo pipefail
          trim() { local s="$1"; s="${s#"${s%%[![:space:]]*}"}"; printf '%s' "${s%"${s##*[![:space:]]}"}"; }
          urldecode() { local s="$1"; printf '%b' "${s//%/\\x}"; }

          link="$(trim "$INPUT_LINK")"
          tag="$(trim "$INPUT_TAG")"
          digest=""

          # package pages on github.com:
          #   /<owner>/<repo>/pkgs/container/<name>[/<id>][?tag=<tag>]
          #   /users|orgs/<owner>/packages/container/[package/]<name>[/<id>][?tag=<tag>]
          page_re='^(https?://)?(www\.)?github\.com/(users/|orgs/)?([^/]+)/(packages/container/(package/)?|[^/]+/pkgs/container/)([^/?#]+)'
          query_re='\?([^#]*)'
          query_tag_re='&tag=([^&]*)'
          # registry references: [ghcr.io/]<owner>/<name>[:<tag>][@sha256:<digest>]
          ref_re='^(https?://|oci://)?(ghcr\.io/)?([A-Za-z0-9-]+)/([^:@[:space:]]+)(:([^@[:space:]]+))?(@(sha256:[0-9a-f]{64}))?$'

          if [[ "$link" =~ $page_re ]]; then
            owner="${BASH_REMATCH[4]}"
            name="$(urldecode "${BASH_REMATCH[7]}")"
            if [[ "$link" =~ $query_re ]] && [[ "&${BASH_REMATCH[1]}" =~ $query_tag_re ]]; then
              tag="$(urldecode "${BASH_REMATCH[1]}")"     # ?tag=... in the link wins over the input
            fi
          elif [[ "$link" =~ $ref_re ]]; then
            owner="${BASH_REMATCH[3]}"
            name="${BASH_REMATCH[4]}"
            if [[ -n "${BASH_REMATCH[6]}" ]]; then tag="${BASH_REMATCH[6]}"; fi
            if [[ -n "${BASH_REMATCH[8]}" ]]; then digest="${BASH_REMATCH[8]}"; fi
          else
            echo "::error::'$link' is not a GitHub Packages (container registry) link or a ghcr.io reference"
            exit 1
          fi

          # the tag input may also be a digest
          if [[ "$tag" == sha256:* ]]; then digest="$tag"; tag=""; fi

          # ghcr.io names are lowercase; validate before talking to the registry
          owner="${owner,,}"; name="${name,,}"
          owner_re='^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$'
          name_re='^[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*(/[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*)*$'
          tag_re='^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'
          if [[ ! "$owner" =~ $owner_re ]] || [[ ! "$name" =~ $name_re ]]; then
            echo "::error::'$owner/$name' is not a valid ghcr.io package name"
            exit 1
          fi
          if [[ -n "$tag" && ! "$tag" =~ $tag_re ]]; then
            echo "::error::'$tag' is not a valid tag"
            exit 1
          fi

          image="ghcr.io/$owner/$name"
          if [[ -z "$tag" && -z "$digest" ]]; then
            echo "::error::The link does not say which version to download. Add ?tag=<tag> to the link or fill in the 'tag' input."
            echo "Tags in $image:"
            oras repo tags "$image" || true
            exit 1
          fi
          if [[ -n "$digest" ]]; then ref="$image@$digest"; else ref="$image:$tag"; fi

          # does it exist? (also turns the tag into the exact digest that will be downloaded)
          if ! descriptor="$(oras manifest fetch --descriptor "$ref" 2>&1)"; then
            echo "::error::$ref was not found on ghcr.io (is the package public, and does the tag exist?)"
            echo "$descriptor"
            echo "Tags in $image:"
            oras repo tags "$image" || true
            exit 1
          fi
          digest="$(jq -r '.digest' <<<"$descriptor")"
          echo "Package: $ref ($digest)"

          # link back to the package page (users/... for people, orgs/... for organizations)
          kind="$(gh api "users/$owner" --jq '.type' 2>/dev/null || echo User)"
          if [[ "$kind" == "Organization" ]]; then seg="orgs"; else seg="users"; fi
          page_url="https://github.com/$seg/$owner/packages/container/package/${name//\//%2F}"

          if [[ -n "$tag" ]]; then title="$owner/$name:$tag"; else title="$owner/$name@${digest:0:19}"; fi

          # temporary release: tag tmp-<expiry date>-<random>; the expire job reads the date from the tag
          days="$EXPIRES_IN_DAYS"
          if [[ ! "$days" =~ ^[0-9]+$ ]] || (( days < 1 )); then days=7; fi
          expires="$(date -u -d "+$days days" +%Y-%m-%d)"
          release_tag="tmp-$(date -u -d "+$days days" +%Y%m%d)-$(od -An -N6 -tx1 /dev/urandom | tr -d ' \n')"
          echo "Release: $release_tag ($title), expires $expires"

          {
            echo "image=$image"
            echo "ref=$ref"
            echo "digest=$digest"
            echo "title=$title"
            echo "release_tag=$release_tag"
            echo "expires=$expires"
            echo "page_url=$page_url"
          } >> "$GITHUB_OUTPUT"

      - name: Pull the package
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.ref.outputs.digest }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/package"
          mkdir -p "$work/files"
          oras pull "$IMAGE@$DIGEST" -o "$work/files"
          oras manifest fetch "$IMAGE@$DIGEST" > "$work/manifest.json"
          if [[ -z "$(find "$work/files" -type f -print -quit)" ]]; then
            echo "::error::$IMAGE@$DIGEST contains no named files - it is probably a Docker image, not a file artifact"
            exit 1
          fi
          du -sh "$work/files"

      - name: Prepare the release assets and notes
        env:
          REF: ${{ steps.ref.outputs.ref }}
          DIGEST: ${{ steps.ref.outputs.digest }}
          EXPIRES: ${{ steps.ref.outputs.expires }}
          PAGE_URL: ${{ steps.ref.outputs.page_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/package"
          files="$work/files"
          assets="$work/assets"
          mkdir -p "$assets"
          limit=$((2000 * 1024 * 1024))   # release assets must stay below 2 GiB

          table="$work/files.md"
          { echo "| File | Size |"; echo "|---|---|"; } > "$table"
          split_any=0
          while IFS= read -r -d '' f; do
            rel="${f#"$files"/}"
            asset="${rel//\//__}"              # assets are flat: sub-folders become part of the name
            size="$(stat -c %s "$f")"
            human="$(numfmt --to=iec-i --suffix=B --format=%.1f "$size")"
            if (( size > limit )); then
              split -b 2000M -d "$f" "$assets/$asset.part"
              rm -f "$f"
              split_any=1
              echo "| \`$rel\` (split into \`$asset.partNN\`) | $human |" >> "$table"
            else
              mv "$f" "$assets/$asset"
              echo "| \`$rel\` | $human |" >> "$table"
            fi
          done < <(find "$files" -type f -print0 | sort -z)

          description="$(jq -r '.annotations["org.opencontainers.image.description"] // empty' "$work/manifest.json")"
          upstream="$(jq -r '.annotations["org.opencontainers.image.url"] // empty' "$work/manifest.json")"
          {
            echo "**Temporary download links - this release and all its files are deleted automatically on $EXPIRES.**"
            echo
            echo "Files of the GitHub Packages artifact [\`$REF\`]($PAGE_URL) (digest \`$DIGEST\`),"
            echo "copied by [this workflow run]($RUN_URL) on $(date -u +%Y-%m-%d) so they can be downloaded from a browser."
            echo
            if [[ -n "$description" ]]; then echo "> $description"; echo; fi
            if [[ -n "$upstream" ]]; then echo "Upstream: $upstream"; echo; fi
            cat "$table"
            if (( split_any )); then
              echo
              echo "Files above 2 GiB were split into \`<file>.partNN\` pieces; reassemble with \`cat <file>.part* > <file>\`."
            fi
            echo
            echo "Permanent copy with ORAS: \`oras pull $REF\`"
          } > "$work/notes.md"
          cat "$work/notes.md"

      - name: Publish the temporary release
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.release_tag }}
          TITLE: ${{ steps.ref.outputs.title }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/package"
          # create as a draft, upload everything, then publish: nobody sees a half-uploaded release
          gh release create "$RELEASE_TAG" --draft --latest=false --target "$GITHUB_SHA" \
            --title "$TITLE" --notes-file "$work/notes.md"
          gh release upload "$RELEASE_TAG" "$work/assets"/*
          gh release edit "$RELEASE_TAG" --draft=false --latest=false

      - name: Write the download links to the job summary
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.release_tag }}
          TITLE: ${{ steps.ref.outputs.title }}
          EXPIRES: ${{ steps.ref.outputs.expires }}
        run: |
          set -euo pipefail
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          {
            echo "## [$TITLE]($release_url)"
            echo
            echo "**These links are deleted automatically on $EXPIRES.**"
            echo
            echo "| File | Size | Direct link |"
            echo "|---|---|---|"
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | [.name, .size] | @tsv' \
              | while IFS=$'\t' read -r name size; do
                  echo "| $name | $(numfmt --to=iec-i --suffix=B --format=%.1f "$size") | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name |"
                done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Download page (expires $EXPIRES): $release_url"
